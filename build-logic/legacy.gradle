import groovy.json.JsonSlurper
import groovy.json.JsonOutput
def props = new Properties()
file('../../version.properties').withInputStream { props.load(it) }
version=props.version
group='cn.foggyhillside.endsdelight'
base.archivesName='ends_delight'
sourceSets.main.resources.srcDir '../../common/src/main/resources'
def generatedJava=layout.buildDirectory.dir('generated/version/java')
sourceSets.main.java.srcDir generatedJava
tasks.register('generateVersion') {
 inputs.property('modVersion',project.version);outputs.dir generatedJava
 doLast {
  def out=new File(generatedJava.get().asFile,'cn/foggyhillside/endsdelight/legacy/BuildVersion.java');out.parentFile.mkdirs()
  out.text="package cn.foggyhillside.endsdelight.legacy; public final class BuildVersion { public static final String VERSION = \"${project.version}\"; private BuildVersion() {} }\n"
 }
}
compileJava.dependsOn 'generateVersion' 
def fd=file('../../../FarmersDelight-Legacy')
def fdProps=new Properties(); new File(fd,'version.properties').withInputStream { fdProps.load(it) }
dependencies { compileOnly files(new File(fd,"versions/${minecraftTarget}/build/devlibs/farmersdelight-${fdProps.version}+mc${minecraftTarget}-dev.jar")) }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
processResources {
 inputs.dir file('../../src/main/resources')
 inputs.files fileTree(new File(fd,'src/main/resources/assets/farmersdelight/models/block')).matching { include 'pie*.json' }
 filesMatching('mcmod.info') { expand(modVersion:project.version,minecraftTarget:minecraftTarget) }
 doLast {
  def roots=[file('../../src/main/resources'),file('../../src/generated/resources')]
  def dest=destinationDir
  def writeJson={ String path,Object value -> def out=new File(dest,path);out.parentFile.mkdirs();out.setText(JsonOutput.toJson(value),'UTF-8') }
  def recipes=[:],tags=[:],language=[:],models=[:],states=[:]
  roots.each { source ->
   fileTree(new File(source,'data/ends_delight/recipes')).matching { include '**/*.json' }.files.sort().each { f ->
    def id='ends_delight:'+new File(source,'data/ends_delight/recipes').toPath().relativize(f.toPath()).toString().replace('\\','/').replaceAll(/\.json$/,'')
    def json=new JsonSlurper().parse(f)
    if(json.type=='forge:conditional') {
     if(json.recipes.size()!=1 || json.recipes[0].conditions.any { it.type!='forge:mod_loaded' || it.modid!='farmersdelight' }) throw new GradleException("Unsupported optional recipe condition: ${id}")
     json=json.recipes[0].recipe
    }
    recipes[id]=json
   }
   fileTree(new File(source,'data')).matching { include '*/tags/items/**/*.json' }.files.each { f ->
    def parts=new File(source,'data').toPath().relativize(f.toPath()).toString().replace('\\','/').split('/tags/items/')
    def id=parts[0]+':'+parts[1].replaceAll(/\.json$/,'');def tag=new JsonSlurper().parse(f)
    if(tags[id]) tags[id].values.addAll(tag.values);else tags[id]=tag
   }
   ['item':'items','block':'blocks'].each { modern,nativeDir -> copy { from new File(source,'assets/ends_delight/textures/'+modern);into new File(dest,'assets/ends_delight/textures/'+nativeDir) } }
   def lang=new File(source,'assets/ends_delight/lang/en_us.json');if(lang.isFile()) language.putAll(new JsonSlurper().parse(lang))
   fileTree(new File(source,'assets/ends_delight/models')).matching { include '**/*.json' }.files.each { f -> models[new File(source,'assets/ends_delight/models').toPath().relativize(f.toPath()).toString().replace('\\','/')]=new JsonSlurper().parse(f) }
   fileTree(new File(source,'assets/ends_delight/blockstates')).matching { include '*.json' }.files.each { f -> states[f.name]=new JsonSlurper().parse(f) }
  }
  writeJson('ends_delight/source_recipes.json',recipes);writeJson('ends_delight/source_tags.json',tags)
  def lang=new File(dest,"assets/ends_delight/lang/${minecraftTarget=='1.12.2'?'en_us':'en_US'}.lang");lang.parentFile.mkdirs();if(lang.exists()) lang.delete()
  lang.setText(language.collect { k,v -> (k.startsWith('block.')?k.replaceFirst('block.','tile.'):k)+'.name='+v }.join('\n')+'\n','UTF-8')
  ['chorus_fruit_pie','chorus_fruit_pie_slice1','chorus_fruit_pie_slice2','chorus_fruit_pie_slice3'].each { name ->
   def model=models['block/'+name+'.json']
   def parent=model.parent.substring('farmersdelight:block/'.length())
   def inherited=new JsonSlurper().parse(new File(fd,'src/main/resources/assets/farmersdelight/models/block/'+parent+'.json'))
   model.elements=inherited.elements;model.textures=(inherited.textures?:[:])+(model.textures?:[:]);model.parent='block/block'
  }
  // The shared serving API stores remaining portions, while upstream pies store bites.
  def pieVariants=[:]
  ['north':0,'east':90,'south':180,'west':270].each { facing,angle ->
   (0..4).each { portions -> pieVariants["facing=${facing},servings=${portions}"]=[model:'ends_delight:block/chorus_fruit_pie'+(portions==4?'':'_slice'+Math.min(3,4-portions)),y:angle] }
  }
  states['chorus_fruit_pie.json']=[variants:pieVariants]
  models.each { path,json ->
   if(json.textures) json.textures=json.textures.collectEntries { k,v -> [(k):v.replace(':block/',':blocks/').replace(':item/',':items/')] }
   if(json.parent=='minecraft:block/orientable_with_bottom') {
    json.parent='block/cube';json.textures=[particle:json.textures.side,down:json.textures.bottom,up:json.textures.top,north:json.textures.front,south:json.textures.side,east:json.textures.side,west:json.textures.side]
   }
   if(json.parent?.startsWith('minecraft:')) json.parent=json.parent.substring('minecraft:'.length())
   // The feast models contain explicit cuboids, also read by FD's 1.7.10 native renderer.
   if(path.startsWith('block/') || minecraftTarget=='1.12.2') writeJson('assets/ends_delight/models/'+path,json)
  }
  if(minecraftTarget=='1.12.2') states.each { path,json ->
   json.variants.values().each { v -> v.model=v.model.replace('ends_delight:block/','ends_delight:') }
   writeJson('assets/ends_delight/blockstates/'+path,json)
  }
 }
}

jar {
 from(new File(fd,'LICENSE')) { into 'META-INF'; rename { 'LICENSE-FarmersDelight-geometry.txt' } }
 from('../../LICENSE') { into 'META-INF'; rename { 'LICENSE-EndsDelight.txt' } }
 manifest { attributes 'Implementation-Title':"End's Delight Legacy",'Implementation-Version':project.version }
 preserveFileTimestamps=false; reproducibleFileOrder=true
 archiveFileName="ends_delight-${project.version}+mc${minecraftTarget}-dev.jar"
 destinationDirectory=layout.buildDirectory.dir('devlibs')
}
tasks.matching { it.name in ['remapJar','reobfJar'] }.configureEach {
 archiveFileName="ends_delight-${project.version}+mc${minecraftTarget}.jar"
 destinationDirectory=layout.buildDirectory.dir('libs')
}
def production=providers.provider { tasks.named(minecraftTarget=='1.7.10' ? 'reobfJar' : 'remapJar').get() }
tasks.register('release',Sync) {
 dependsOn production
 from production.flatMap { it.archiveFile }
 into layout.buildDirectory.dir('release')
 doFirst {
  def jar=production.get().archiveFile.get().asFile
  def zip=new java.util.zip.ZipFile(jar)
  try {
   ['mcmod.info','ends_delight/foods.json','ends_delight/source_recipes.json','ends_delight/source_tags.json','cn/foggyhillside/endsdelight/legacy/EndsDelight.class','cn/foggyhillside/endsdelight/legacy/EndStove.class','assets/ends_delight/textures/items/dragon_tooth.png'].each { if(!zip.getEntry(it)) throw new GradleException("Missing distribution entry: ${it}") }
   zip.entries().each { e -> if(e.name.startsWith('vectorwing/') || e.name.startsWith('net/minecraft/') || e.name.endsWith('.java')) throw new GradleException("Bundled dependency/source: ${e.name}") }
  } finally { zip.close() }
 }
}
tasks.named('build') { dependsOn 'release' }
